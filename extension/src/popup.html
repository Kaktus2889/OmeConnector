<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OmeConnector</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup">
    <header><div><h1>OmeConnector</h1><p>Panel OmeTV</p></div><span class="dot"></span></header>
    <label><span>Pokazuj overlay</span><input id="enabled" type="checkbox"></label>
    <label><span>Auto Skip</span><input id="autoSkip" type="checkbox"></label>
    <label><span>Skip bez aktywnej kamery</span><input id="skipNoCamera" type="checkbox"></label>
    <label><span>Minimalna liczba kamer</span><input id="minVideos" type="number" min="0" max="4"></label>
    <label><span>Kompaktowy panel</span><input id="compact" type="checkbox"></label>
    <button id="resetPosition" class="secondary" type="button">Resetuj pozycję panelu</button>
    <section class="updates">
      <strong>Aktualizacje</strong>
      <p id="updateStatus">Sprawdzanie…</p>
      <a id="downloadUpdate" hidden target="_blank" rel="noopener">Pobierz najnowszą wersję</a>
      <button id="checkUpdate" class="secondary" type="button">Sprawdź teraz</button>
    </section>
    <p class="notice">Rozszerzenie sprawdza wersję z GitHuba co godzinę. W trybie „Load unpacked” Chrome nie może sam podmienić plików — po aktualizacji kliknij Odśwież na stronie rozszerzeń.</p>
    <button id="save" type="button">Zapisz ustawienia</button>
    <p id="message" class="message"></p>
  </main>
  <script src="popup.js"></script>
</body>
</html>
